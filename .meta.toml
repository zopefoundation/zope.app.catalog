# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[meta]
template = "pure-python"
commit-id = "f63da99d"

[python]
with-pypy = false
with-sphinx-doctests = false
with-windows = false
with-future-python = false
with-macos = false
with-docs = false
with-free-threaded-python = false

[coverage]
fail-under = 98

[manifest]
additional-rules = [
    "recursive-include src *.gif",
    "recursive-include src *.pt",
    "recursive-include src *.rst",
    "recursive-include src *.zcml",
    ]

[flake8]
additional-config = [
    "# F401 imported but unused",
    "per-file-ignores =",
    "    src/zope/app/catalog/attribute.py: F401",
    "    src/zope/app/catalog/catalog.py: F401",
    "    src/zope/app/catalog/field.py: F401",
    "    src/zope/app/catalog/interfaces.py: F401",
    "    src/zope/app/catalog/keyword.py: F401",
    "    src/zope/app/catalog/text.py: F401",
    ]
